<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075746"><title>مسابقة رياحين | رحلة مؤيد</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#e7fff2,#fff7dc 55%,#eaf9ff);color:#124a3b;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:14px 14px 90px}.hero{background:linear-gradient(140deg,#075b4b,#16866d);color:white;border-radius:26px;overflow:hidden;box-shadow:0 12px 30px #075b4b33;text-align:center}.hero img{width:50%;height:auto;max-height:380px;object-fit:contain;object-position:center;display:block;background:#064b3d;margin:12px auto 0;border-radius:18px}.hero h1{font-size:29px;margin:14px 0 4px}.hero p{margin:0 0 18px;color:#ffedb3;font-weight:bold}.card{background:#fff;border:1px solid #cbe8d8;border-radius:22px;margin-top:14px;padding:18px;box-shadow:0 6px 20px #075b4b12}.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:bold}.star{font-size:27px;color:#b67900}.bar{height:13px;border-radius:20px;background:#e7f1e8;overflow:hidden;margin-top:12px}.bar>div{height:100%;background:linear-gradient(90deg,#1dba80,#f1c65a);transition:width .4s}.days{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.day{flex:0 0 auto;border:2px solid #b5dfc7;background:#fff;border-radius:14px;padding:11px 14px;font-weight:bold;color:#13533f}.day.active{background:#087c61;color:#fff;border-color:#087c61}.day.complete{border-color:#d6a323}.session{display:flex;align-items:center;gap:12px;background:#f5fcf7;border:1px solid #d8eadc;border-radius:18px;padding:14px;margin:12px 0}.session.done{background:#e7faee}.session .icon{font-size:31px}.session .info{flex:1;min-width:0}.session .small{font-size:14px;color:#497b66;font-weight:bold}.session .task{font-size:20px;font-weight:900;line-height:1.6;margin-top:4px}.check{width:33px;height:33px;accent-color:#078665;cursor:pointer}.btn{background:#087c61;border:0;color:#fff;border-radius:14px;padding:12px 16px;font-weight:bold;font-size:15px;cursor:pointer}.btn.alt{background:#f4e7bd;color:#735007}.btn:disabled{opacity:.5}.reward{border:2px dashed #e0c36a;background:#fff9e6;border-radius:16px;padding:15px;margin:10px 0;font-weight:bold}.reward.unlocked{background:#e8fff0;border-color:#38b986}.muted{color:#57786c;font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.welcome{background:#fff1bd;border:2px solid #e9c663;border-radius:18px;padding:14px;font-size:17px;font-weight:bold;margin-top:14px}.overlay{position:fixed;inset:0;background:#032f29bb;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{background:#fff;border-radius:24px;padding:24px;max-width:380px;width:100%;text-align:center}.modal input{font-size:25px;letter-spacing:6px;width:100%;text-align:center;border:2px solid #b5d9c4;border-radius:12px;padding:10px;margin:12px 0}.celebrate{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#064b3ddd;overflow:hidden;text-align:center;color:white}.celebrate.show{display:flex}.celebrate h2{font-size:clamp(48px,12vw,80px);line-height:1.35;font-weight:900;color:#ffe18c;text-shadow:0 5px 20px #0009;animation:bounce 1.3s infinite}.celebrate .big{font-size:70px;animation:bounce 1.3s infinite}.spark{position:absolute;top:-12%;font-size:27px;animation:fall linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(120vh) rotate(650deg)}}@keyframes bounce{50%{transform:scale(1.17)}}.close{position:absolute;top:15px;left:15px;background:#fff3;color:#fff;border:1px solid #fff7;border-radius:12px;padding:10px}.tiny{font-size:12px}button{font-family:inherit}h2{margin:0 0 10px}input[type=file]{max-width:100%}@media(min-width:650px){.hero img{max-height:380px}.wrap{padding:24px}}

.settings-grid{display:grid;gap:12px;text-align:right}.settings-grid label{font-weight:bold;display:block;margin-bottom:5px}.settings-grid input{width:100%;border:2px solid #cbe8d8;border-radius:12px;padding:12px;font:inherit}.settings-item{padding:12px;background:#f4fbf6;border-radius:14px}.settings-item .row input:first-child{flex:2;min-width:130px}.settings-item .row input[type=number]{flex:1;min-width:80px}.footer-settings{display:block;width:100%;margin-top:18px}.modal.settings-modal{max-width:520px;max-height:85vh;overflow-y:auto}.settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.settings-actions button{flex:1}.celebrate .big{filter:drop-shadow(0 0 16px #ffd75c)}.history-summary{margin-top:16px;padding:15px;border-radius:17px;background:linear-gradient(130deg,#e6f9ec,#fff2bf);border:2px solid #e5c75f;font-weight:900;font-size:19px;line-height:1.9}.history-summary .next{font-size:16px;color:#79530b}
</style></head><body><main class="wrap"><section class="hero"><img src="muayyad-champion.png" alt="مؤيد بالتاج الذهبي والثوب الأبيض ووشاح الفائز الأول"><h1>🌙 مسابقة رياحين 🌙</h1><p>رحلة مؤيد إلى التاج الذهبي 👑</p></section><div class="welcome" id="welcome"></div><section class="card"><div class="stat"><span>⭐ نجوم مؤيد</span><span class="star" id="stars">0 ⭐</span></div><div class="bar"><div id="progress"></div></div><p class="muted" id="status"></p></section><section class="card"><h2>📖 مغامرات الحفظ</h2><div class="days" id="days"></div><h2 id="dayTitle"></h2><div id="sessions"></div></section><section class="card"><h2>🎁 صندوق المفاجآت</h2><div id="rewards"></div></section><section class="card"><h2>📜 سجل إنجازاتي</h2><div id="history"></div><div class="history-summary" id="historySummary" aria-live="polite"></div></section><section class="card"><h2>💾 حفظ رحلتي</h2><div class="row"><button class="btn" id="export">حفظ نسخة من النجوم</button><button class="btn alt" id="importBtn">استعادة النسخة</button><input type="file" id="importFile" accept="application/json" hidden></div></section><button class="btn alt footer-settings" id="settingsBtn">⚙️ إعدادات الجوائز</button></main><div class="overlay" id="settingsAuth"><div class="modal"><h2>🔐 إعدادات الجوائز</h2><p>رمز إعدادات الجوائز</p><input id="settingsPin" type="password" inputmode="numeric" autocomplete="off"><p id="settingsError" style="color:#c33"></p><div class="row"><button class="btn" id="settingsLogin">دخول</button><button class="btn alt" id="settingsCancel">إلغاء</button></div></div></div><div class="overlay" id="settingsOverlay"><div class="modal settings-modal"><h2>🎁 إعدادات الجوائز</h2><div id="rewardEditor" class="settings-grid"></div><div class="settings-item" style="margin-top:14px;text-align:right"><label for="newSettingsPin">تغيير رمز إعدادات الجوائز</label><input id="newSettingsPin" type="password" inputmode="numeric" minlength="4" maxlength="8" placeholder="اتركه فارغًا للاحتفاظ بالرمز الحالي"></div><p id="settingsSaveError" style="color:#c33"></p><div class="settings-actions"><button class="btn" id="settingsSave">حفظ التعديلات</button><button class="btn alt" id="settingsClose">إلغاء</button></div></div></div><div class="overlay" id="auth"><div class="modal"><h2>🔐 موافقة ماما أو بابا</h2><p>أدخل رمز الوالدين</p><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><p id="error" style="color:#c33"></p><div class="row"><button class="btn" id="confirm">تأكيد</button><button class="btn alt" id="cancel">إلغاء</button></div></div></div><div class="celebrate" id="celebrate"><button class="close" id="skip">إغلاق الاحتفال ✕</button><div style="position:relative;z-index:2;padding:25px"><div class="big">👑🌙⭐</div><h2 id="cheer">ممتاز يا بطل!</h2><p style="font-size:23px">⭐ نجم رياحين ⭐</p><p>واصل رحلتك إلى التاج الذهبي 🏆</p></div></div><script>
const KEY='riyahin_muayyad_v3';const groups=[['نوح',1,28],['الجن',1,28],['المرسلات',26,50]];let portions=[];for(const [name,start,end] of groups){for(let i=start;i<=end;i+=5)portions.push(`سورة ${name}، الآيات ${i} إلى ${Math.min(i+4,end)}`)}const N=Math.max(17,portions.length);const reviews=['الملك والنبأ','القلم والنازعات','الحاقة وعبس','المعارج والتكوير','المزمل والانفطار','المدثر والمطففين','القيامة والانشقاق','الإنسان والبروج','المرسلات والطارق','النبأ إلى عبس','التكوير إلى الانشقاق','البروج إلى الفجر','البلد إلى العلق','القدر إلى الناس','جزء تبارك','جزء عم'];const defaultRewards=[{n:12,name:'اللعب على الكمبيوتر لمدة نصف ساعة 💻'},{n:25,name:'الخروج إلى الحديقة لمدة نصف ساعة 🌳'},{n:40,name:'مرافقة بابا في التسوق للمنزل 🛒'},{n:55,name:'كيس شيبسي حجم وسط 🥔'},{n:70,name:'عصير حجم وسط 🧃'},{n:90,name:'اختيار نزهة عائلية جميلة 🌟'},{n:115,name:'اختيار نشاط عائلي مميز 🏅'}];const tasks=[['📗','حفظ جديد','15 دقيقة',d=>portions[d]||'تثبيت السور المحفوظة',2],['🔁','مراجعة','15 دقيقة',d=>reviews[d%reviews.length],2],['📖','تثبيت الحفظ','15 دقيقة',d=>d===0?'سورة نوح، الآيات 1 إلى 5':'آيات الحفظ السابق والمواضع الصعبة',2],['🌟','تحدي التسميع','10 دقائق',d=>'تسميع من الحفظ والمراجعة',2],['💚','نجمة الاجتهاد','',d=>'أحسنت في المحاولة والتصحيح',1]];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};if(!state.checked||typeof state.checked!=='object')state.checked={};if(!Array.isArray(state.log))state.log=[];if(!Array.isArray(state.rewards))state.rewards=defaultRewards.map(r=>({...r}));if(!state.settingsPin)state.settingsPin='7373';if(!state.cheerUnlocked||typeof state.cheerUnlocked!=='object')state.cheerUnlocked={};if(!state.cheerVisual||typeof state.cheerVisual!=='object')state.cheerVisual={};if(typeof state.effortUnlocked!=='boolean')state.effortUnlocked=Object.values(state.cheerUnlocked).some(Boolean)||Object.keys(state.checked).some(k=>k.endsWith('-4')&&state.checked[k]===true);for(const entry of state.log){if(entry&&!entry.key&&entry.title){for(let d=0;d<N&&!entry.key;d++){for(let i=0;i<tasks.length;i++){if(entry.title===tasks[i][1]+'، '+tasks[i][3](d)){entry.key=d+'-'+i;break}}}}}let selected=0,pending=null,celebrationTimer=null,audioCtx=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function count(){return Object.entries(state.checked).reduce((sum,[k,v])=>sum+(v?tasks[Number(k.split('-')[1])]?.[4]||0:0),0)}function finished(d){return tasks.every((_,i)=>state.checked[`${d}-${i}`])}function current(){for(let i=0;i<N;i++)if(!finished(i))return i;return N-1}function render(){const total=count();$('stars').textContent=total+' ⭐';$('progress').style.width=Math.min(100,total/(N*9)*100)+'%';$('status').textContent=`${Object.values(state.checked).filter(Boolean).length} نشاطًا مكتملًا · ${Array.from({length:N},(_,i)=>finished(i)).filter(Boolean).length} مرحلة مكتملة`;const last=state.log.find(x=>x.value&&state.checked[x.key]);$('welcome').textContent=last?`🌟 أهلًا يا مؤيد! آخر إنجاز لك: ${last.title}. ما شاء الله، واصل يا بطل!`:'🌟 أهلًا يا مؤيد! أنت بطل رياحين، والتاج الذهبي ينتظرك بإذن الله!';$('days').innerHTML='';for(let i=0;i<N;i++){let b=document.createElement('button');b.className='day'+(i===selected?' active':'')+(finished(i)?' complete':'');b.textContent=`${finished(i)?'🏅 ':''}المرحلة ${i+1}`;b.onclick=()=>{selected=i;render()};$('days').append(b)}$('dayTitle').textContent=`🌿 المرحلة ${selected+1}`;$('sessions').innerHTML='';tasks.forEach((t,i)=>{let key=`${selected}-${i}`,done=!!state.checked[key];let el=document.createElement('div');el.className='session'+(done?' done':'');let ico=document.createElement('span');ico.className='icon';ico.textContent=t[0];let info=document.createElement('div');info.className='info';let small=document.createElement('div');small.className='small';small.textContent=t[1]+(t[2]?' · '+t[2]:'')+` · ${t[4]} ⭐`;let detail=document.createElement('div');detail.className='task';detail.textContent=t[3](selected);info.append(small,detail);let box=document.createElement('input');box.type='checkbox';box.className='check';box.checked=(i===4&&state.effortUnlocked)?(key in state.cheerVisual?!!state.cheerVisual[key]:done):done;box.setAttribute('aria-label',t[1]);box.addEventListener('change',e=>{const requested=e.target.checked;if(i===4&&state.effortUnlocked){state.cheerVisual[key]=requested;save();render();celebrate();return}e.target.checked=done;openAuth(key,requested,t[1]+'، '+t[3](selected))});el.append(ico,info,box);$('sessions').append(el)});$('rewards').innerHTML='';state.rewards.forEach(r=>{let div=document.createElement('div');div.className='reward'+(total>=r.n?' unlocked':'');div.textContent=total>=r.n?`🎉 ${r.name} · ${r.n} نجمة`:`🔒 مفاجأة سرية عند ${r.n} ⭐`; $('rewards').append(div)});$('history').innerHTML='';let seen=new Set();let recent=state.log.filter(x=>{if(!x.value||!x.key||!state.checked[x.key]||seen.has(x.key))return false;seen.add(x.key);return true}).slice(0,8);if(!recent.length)$('history').textContent='🌱 أول إنجاز في انتظارك!';recent.forEach(x=>{let d=document.createElement('p');d.textContent='⭐ '+x.title;$('history').append(d)});let next=[...state.rewards].sort((a,b)=>a.n-b.n).find(r=>r.n>total);$('historySummary').innerHTML='';let sum=document.createElement('div');sum.textContent='⭐ مجموع نجوم مؤيد الآن: '+total+' نجمة';$('historySummary').append(sum);let remaining=document.createElement('div');remaining.className='next';remaining.textContent=next?'🎁 باقي '+(next.n-total)+' نجمة على الجائزة التالية!':'🏆 أحسنت يا مؤيد! فتحت جميع الجوائز!';$('historySummary').append(remaining)}function openAuth(key,value,title){pending={key,value,title};$('pin').value='';$('error').textContent='';$('auth').classList.add('show');$('pin').focus()}function closeAuth(){$('auth').classList.remove('show');$('pin').value='';$('error').textContent='';pending=null;render()}function confirm(){if($('pin').value!=='5252'){$('error').textContent='الرمز غير صحيح';$('pin').value='';return}if(!pending)return;state.checked[pending.key]=pending.value;if(pending.key.endsWith('-4')&&pending.value){state.cheerUnlocked[pending.key]=true;state.effortUnlocked=true;state.cheerVisual[pending.key]=true;}state.log=state.log.filter(x=>x.key!==pending.key);if(pending.value)state.log.unshift({key:pending.key,title:pending.title,value:true,at:Date.now()});save();const yes=pending.value;closeAuth();render();if(yes)celebrate()}$('confirm').onclick=confirm;$('cancel').onclick=closeAuth();$('auth').addEventListener('click',e=>{if(e.target===$('auth'))closeAuth()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('auth').classList.contains('show')){e.preventDefault();closeAuth()}});window.addEventListener('popstate',()=>{if($('auth').classList.contains('show'))closeAuth()});$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')confirm()});const celebrationAudio=new Audio('celebration.mp3');celebrationAudio.preload='auto';celebrationAudio.volume=.85;function sounds(){try{celebrationAudio.pause();celebrationAudio.currentTime=0;const promise=celebrationAudio.play();if(promise)promise.catch(()=>{});}catch(e){}}
function celebrate(){let c=$('celebrate');c.classList.add('show');const phrases=['ممتاز يا مؤيد!','أحسنت يا بطل!','رائع جدًا!','ما شاء الله!','أنت نجم رياحين!','إنجاز عظيم يا بطل!','برافو يا مؤيد!','تستحق التصفيق!','يا سلام على الشطارة!','واصل يا بطل القرآن!','أبدعت يا مؤيد!','تقدم رائع!'];const options=phrases.filter(p=>p!==state.lastCheer);const phrase=options[Math.floor(Math.random()*options.length)];$('cheer').textContent=phrase;state.lastCheer=phrase;save();c.querySelectorAll('.spark').forEach(x=>x.remove());for(let i=0;i<85;i++){let s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','🌙','🏮','🌟','💛'][i%6];s.style.left=Math.random()*100+'%';s.style.animationDuration=(5+Math.random()*9)+'s';s.style.animationDelay=Math.random()*3+'s';c.append(s)}sounds();clearTimeout(celebrationTimer);celebrationTimer=setTimeout(stopCelebrate,13000)}function stopCelebrate(){$('celebrate').classList.remove('show');clearTimeout(celebrationTimer);celebrationAudio.pause();celebrationAudio.currentTime=0;}$('skip').onclick=stopCelebrate;
function closeSettingsAuth(){$('settingsAuth').classList.remove('show');$('settingsPin').value=''}
$('settingsBtn').onclick=()=>{$('settingsError').textContent='';$('settingsPin').value='';$('settingsAuth').classList.add('show');$('settingsPin').focus()};
$('settingsCancel').onclick=closeSettingsAuth;
function settingsLogin(){if($('settingsPin').value!==state.settingsPin){$('settingsError').textContent='الرمز غير صحيح';$('settingsPin').value='';return}closeSettingsAuth();openSettings()}
$('settingsLogin').onclick=settingsLogin;$('settingsPin').onkeydown=e=>{if(e.key==='Enter')settingsLogin()};
function openSettings(){$('rewardEditor').innerHTML='';state.rewards.forEach((r,i)=>{let el=document.createElement('div');el.className='settings-item';let label=document.createElement('label');label.textContent='الجائزة '+(i+1);let row=document.createElement('div');row.className='row';let name=document.createElement('input');name.value=r.name;name.maxLength=100;name.setAttribute('aria-label','اسم الجائزة');name.className='rewardName';let n=document.createElement('input');n.type='number';n.min='1';n.max='9999';n.value=r.n;n.className='rewardThreshold';n.setAttribute('aria-label','عدد النجوم المطلوبة');row.append(name,n);el.append(label,row);$('rewardEditor').append(el)});$('newSettingsPin').value='';$('settingsSaveError').textContent='';$('settingsOverlay').classList.add('show')}
$('settingsClose').onclick=()=>$('settingsOverlay').classList.remove('show');
$('settingsSave').onclick=()=>{let entries=[...$('rewardEditor').querySelectorAll('.settings-item')];let updated=entries.map(el=>({name:el.querySelector('.rewardName').value.trim(),n:Number(el.querySelector('.rewardThreshold').value)}));if(updated.some(r=>!r.name||!Number.isInteger(r.n)||r.n<1||r.n>9999)){$('settingsSaveError').textContent='تأكد من اسم كل جائزة وعدد النجوم';return}let newPin=$('newSettingsPin').value;if(newPin&&!/^\d{4,8}$/.test(newPin)){$('settingsSaveError').textContent='رمز الإعدادات يجب أن يكون من 4 إلى 8 أرقام';return}state.rewards=updated;if(newPin)state.settingsPin=newPin;save();$('settingsOverlay').classList.remove('show');render()};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'riyahin',state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='riyahin-muayyad-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.app!=='riyahin'||!data.state||!data.state.checked||!Array.isArray(data.state.log))throw Error();let code=prompt('رمز موافقة الوالدين لاستعادة السجل');if(code!=='5252')return;state=data.state;save();selected=current();render();alert('تمت استعادة إنجازات مؤيد ⭐')}catch{alert('تعذر قراءة النسخة الاحتياطية')}};selected=current();render();
</script></body></html>
